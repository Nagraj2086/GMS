{% extends 'base.html' %}
{% block main %}
    <h2 class="mb-3">
        {% if mode == 'add' %}
            Add Plan
        {% else %}
            Edit Plan
        {% endif %}
    </h2>
    <form action="" method="post" class="row g-3 w-75">
        {% csrf_token %}
        <div class="col-md-6">
            <label for="name" class="form-label" >Plan Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{plan.name|default:''}}">
        </div>
        <div class="col-md-3">
            <label for="duration_months" class="form-label" >Duration (months) *</label>
            <input type="number" class="form-control" id="duration_months" name="duration_months" value="{{plan.duration_months|default:''}}">
        </div>
        <div class="col-md-3">
            <label for="fee" class="form-label" >Fee *</label>
            <input type="number" step="0.01" class="form-control" id="fee" name="fee" value="{{plan.fee|default:''}}">
        </div>

        <div class="col-12">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" rows="3" name="description" id="description" value="{{plan.description|default:''}}"></textarea>
        </div>
        <div class="col-md-12">
            <button type="submit" class="btn btn-primary" >
                {% if mode == 'add' %} Add Plan {% else %} Update Plan {% endif %}
            </button>
            <a href="{% url 'admin_plans_list' %}" class="btn btn-secondary"> Cancel </a>
        </div>
    </form>
{% endblock %}
