{% extends 'base.html' %}
{% block main %}
    <h2 class="mb-3">
        {% if mode == 'add' %}
            Add Member
        {% else %}
            Edit Member
        {% endif %}
    </h2>
    <form action="" method="post" class="row g-3 w-75">
        {% csrf_token %}
        <div class="col-md-6">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="{{member.user.username|default:''}}" required>
        </div>
        <div class="col-md-6">
            <label for="password" class="form-label">password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="col-md-6">
            <label for="full_name" class="form-label" >Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{member.full_name|default:''}}">
        </div>
        <div class="col-md-3">
            <label for="mobile" class="form-label" >Mobile</label>
            <input type="text" class="form-control" id="mobile" name="mobile" value="{{member.mobile|default:''}}" maxlength="10">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="age">Age</label>
            <input type="number" name="age" class="form-control" value="{{member.age|default:''}}">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="gender">Gender</label>
            <select name="gender" id="gender" class="form-control">
                <option value="">Select Gender</option>
                <option value="MALE" {% if member.gender == 'Male' %} selected{% endif %}>Male</option>
                <option value="FEMALE" {% if member.gender == 'Female' %} selected{% endif %}>Female</option>
                <option value="OTHER" {% if member.gender == 'Other' %} selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="col-md-3">
            <label for="join_date" class="form-label">Join Date</label>
            <input type="date" name="join_date" class="form-control" value="{{member.join_date|date:'Y-m-d'}}">
        </div>
        <div class="col-md-6">
            <label for="address" class="form-label">Address</label>
            <textarea name="address" class="form-control" id="address" rows="2" >{{member.address|default:''}}</textarea>
        </div>
        <div class="col-md-6">
            <label for="" class="form-label">Membership Plan</label>
            <select name="plan_id" id="plan_id" class="form-select">
                <option value="">No Plan</option>
                {% for plan in plans %}
                <option value="{{ plan.id }}">{{plan.name}} - ({{plan.duration_months}} months - ₹{{plan.fee}})</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6">
            <label for="" class="form-label">Trainers</label>
            <select name="trainer_id" id="trainer_id" class="form-select">
                <option value="">No Trainer</option>
                {% for trainer in trainers %}
                    <option value="{{trainer.id}}" {% if member.trainer.id == trainer.id %} selected{% endif %}>{{trainer.name}} - {{trainer.specialization}}</option>
                {% endfor %}
            </select>
        </div>

        
        <div class="col-md-12">
            <button type="submit" class="btn btn-primary" >
                {% if mode == 'add' %} Add Member {% else %} Update Member {% endif %}
            </button>
            <a href="{% url 'admin_members_list' %}" class="btn btn-secondary"> Cancel </a>
        </div>
    </form>
{% endblock %}
