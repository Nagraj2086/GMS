{% extends 'base.html' %}
{% block main %}
    <h2 class="mb-3">Memmbers Feedbacks</h2>
    <form action="" class="row g-2 mb-3" method="get">
        <div class="col-md-4">
            
            <select name="member_id" id="" class="form-select">
                <option value="">All Member</option>
                {% for member in members  %}
                <option value="{{member.id}}">{{member.full_name}} </option>
                {% endfor %}
            </select>
        </div>


        <div class="col-md-2 d-flex align-items-end" >
            <button type="submit" class="btn btn-secondary">Filter</button>
        </div>
    </form>
        <table class="table table-bordered table-striped w-75">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Member</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for feedback in feedbacks %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ feedback.member.full_name }}</td>
                    <td>{{ feedback.message }}</td>
                    <td>{{ feedback.created_at }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No Feedbacks Found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
{% endblock %}
